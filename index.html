<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Hormigón Casa Baguales</title>
<style>
/* Visor 3D de obra: lienzo a pantalla completa, panel inferior plegable, controles táctiles */
:root{
  --bg:#eef0ec; --fg:#1d2420; --muted:#5d675f; --line:#cfd5cc; --card:#fbfcfa; --accent:#1f6f8b;
  --c-cim:#3b82c4; --c-vei:#e8892b; --c-esc:#d6402b; --c-rad:#4aa564; --c-ter:#b79b6b; --grid:#d3d8d0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b18; --fg:#e7ece8; --muted:#a2ada5; --line:#34403a; --card:#202823; --accent:#6cc0dc; --grid:#2a332d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b18; --fg:#e7ece8; --muted:#a2ada5; --line:#34403a; --card:#202823; --accent:#6cc0dc; --grid:#2a332d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
.chip{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:calc(100% - 24px - 190px)}
.chip b{display:block;font-size:15px}
.chip span{color:var(--muted);font-size:12px}
.views{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:40px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));max-height:46vh;overflow:auto}
#sheet .in{max-width:520px;margin:0 auto}
#head{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;background:none;border:0;padding:0;text-align:left;border-radius:0}
#head .tot{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#head .sub{color:var(--muted);font-size:12px}
#head .chev{margin-left:auto;font-size:18px;transition:transform .2s}
#head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.row{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line);cursor:pointer}
.row input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid #0003}
.row .nm{min-width:0;flex:1}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sep0{display:flex;align-items:center;gap:12px;padding:0 0 10px}
.sep0 label{color:var(--muted);font-size:13px;white-space:nowrap}
.sep0 input{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.note{color:var(--muted);font-size:12px;padding:0 0 12px}
.lv{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;transform:translate(-50%,-50%);white-space:nowrap}
@media (min-width:760px){#sheet{right:auto;width:400px;left:12px;bottom:12px;border:1px solid var(--line);border-radius:14px;max-height:80vh}}
@media (prefers-reduced-motion:reduce){#head .chev{transition:none}}
</style>

let tot=0;for(const k of ['cim','vei','esc','rad']){tot+=VOL[k];$('v_'+k).textContent=f2(VOL[k])+' m³';$('a_'+k).textContent='Superficie en planta: '+f2(AREA[k])+' m²';}
$('tot').textContent=f2(tot);
for(const k of ['cim','vei','esc','rad','ter']){const el=$('k_'+k);el.addEventListener('change',()=>{L[k].visible=el.checked;});}
$('head').addEventListener('click',()=>{const o=$('head').getAttribute('aria-expanded')==='true';$('head').setAttribute('aria-expanded',String(!o));$('body2').hidden=o;});
// cámara orbital

function fit(){const a=innerWidth/innerHeight;const need=(DATA.W/2*1.2)/(Math.tan(20*Math.PI/180)*Math.min(a,1.6));rad=Math.max(30,Math.min(need*1.12,220));}
function upd(){cam.position.set(tx+rad*Math.sin(ph)*Math.sin(th),tyy+rad*Math.cos(ph),tz+rad*Math.sin(ph)*Math.cos(th));cam.up.set(0,1,0);cam.lookAt(tx,tyy,tz);}
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',()=>{rs();});rs();fit();upd();
const P=new Map();let lastD=0,lastC=null;
function pan(dx,dy){const k=rad*0.0016;tx-=Math.cos(th)*dx*k;tz+=Math.sin(th)*dx*k;tx-=Math.sin(th)*dy*k;tz-=Math.cos(th)*dy*k;}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  for(const [id,q] of P){if(e.timeStamp-q.t>600)P.delete(id);}            // descarta toques fantasma
  P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey,t:e.timeStamp});lastD=0;lastC=null;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if($('head').getAttribute('aria-expanded')==='true'){$('head').click();}   // tocar el modelo cierra el panel
});
function end(e){P.delete(e.pointerId);if(P.size<2){lastD=0;lastC=null;}}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
addEventListener('pointerup',end);addEventListener('pointercancel',end);addEventListener('blur',()=>{P.clear();});
cv.addEventListener('pointermove',e=>{
  const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;p.t=e.timeStamp;
  if(P.size===1){ if(p.s||p.b===2)pan(dx,dy); else{th-=dx*0.006;ph=Math.min(1.55,Math.max(0.02,ph-dy*0.006));} }
  else if(P.size>=2){const a=[...P.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(lastD>0){rad=Math.min(220,Math.max(4,rad*lastD/d));} if(lastC){pan(c.x-lastC.x,c.y-lastC.y);} lastD=d;lastC=c;}
  upd();});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(220,Math.max(4,rad*(1+Math.sign(e.deltaY)*0.1)));upd();},{passive:false});
function view(n,t,p,r){th=t;ph=p;tx=cx;tz=cz;$('ex').value=0;place();fit();if(r)rad*=r;upd();['vTop','vIso','vSide'].forEach(i=>$(i).setAttribute('aria-pressed',String(i===n)));}
$('vTop').addEventListener('click',()=>view('vTop',0,0.02,1));
$('vIso').addEventListener('click',()=>view('vIso',-0.6,0.9,1));
$('vSide').addEventListener('click',()=>view('vSide',0,1.5,0.8));
window.__dbg=()=>({th,ph,rad,tyy,n:P.size,open:$('head').getAttribute('aria-expanded')});
const l1=$('L1'),l2=$('L2');
function lab(el,x,y,z){const v=new THREE.Vector3(x,y,z).project(cam);el.style.left=((v.x+1)/2*innerWidth)+'px';el.style.top=((1-v.y)/2*innerHeight)+'px';el.hidden=!(v.z<1);}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
(function loop(){R.render(S,cam);lab(l1,DATA.XH*0.45,1.3,cz);lab(l2,DATA.XH+(DATA.W-DATA.XH)*0.5,0.7,cz);requestAnimationFrame(loop);})();
})();
</script>
